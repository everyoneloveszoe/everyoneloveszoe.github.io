<h2> Schriftart-Umwandler </h2>
<p>Hier ist ein Umwandler von Arial in Kapitälchen</p>
<p> Dein Facharbeits-Retter </p>


<style>

   #eingabe {
   font-size: 40px;
   font-family: Arial:
   padding: 8px;
   }
   #ausgabe {
   font-size: 40px;
   font-variant: small-caps;
   padding: 8px;
   background-color: #999999;
   }


</style>
</head>
</body>
   <textarea id="eingabe" oninput="umwandeln()" ></textarea>
   <textarea id="ausgabe"></textarea>


<script>
   function umwandeln() {
	eingabe=document.getElementById("eingabe").value;
	document.getElementById("ausgabe").value = eingabe;  
   }

</script>
